name = "esp-launcher-hub"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

routes = [{ pattern = "hub.c3p0.dev", custom_domain = true }]

# HTML pages (dashboard at /, BLE setup at /setup and legacy /ops/setup) are bundled as text.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
# Cloudflare Access team domain and application audience tags (non-secret).
ACCESS_TEAM = "e7h4n-investments-pages.cloudflareaccess.com"
ACCOUNT_ID = "e630c3085e396154f7333b9b61f78226"
DEVICE_AUD = ""
OPS_AUD = ""
# Clerk publishable key (non-secret), from the repo variable CLERK_PUBLISHABLE_KEY at deploy time.
CLERK_PUBLISHABLE_KEY = ""

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "DeviceHub"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeviceHub", "Registry"]
