name: hub

on:
  push:
    branches: [main]
    paths: ["hub/**", ".github/workflows/hub.yml"]
  pull_request:
    paths: ["hub/**", ".github/workflows/hub.yml"]
  workflow_dispatch:

concurrency:
  group: hub-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: e630c3085e396154f7333b9b61f78226
  HUB_HOST: hub.c3p0.dev

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hub } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: hub/package-lock.json }
      - run: npm ci
      - run: for f in src/*.js scripts/*.mjs; do node --check "$f"; done
      - run: python3 -m py_compile test/prod_e2e.py
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: API end-to-end against a local hub (developer secrets, device tokens, relay)
        run: |
          npx wrangler dev --var DEV_INSECURE:1 --port 8787 --ip 127.0.0.1 > /tmp/wdev.log 2>&1 &
          for i in $(seq 1 60); do curl -s -m 2 http://127.0.0.1:8787/api/config >/dev/null && break; sleep 1; done
          node test/api_local.mjs http://127.0.0.1:8787 || { tail -50 /tmp/wdev.log; exit 1; }

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: hub } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPS_ALLOWED_EMAILS: ${{ vars.OPS_ALLOWED_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: hub/package-lock.json }
      - run: npm ci
      - name: Configure Cloudflare Access applications
        run: node scripts/setup-access.mjs >> "$GITHUB_ENV"
      - name: Deploy worker
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$CLERK_PUBLISHABLE_KEY" ]; then echo "::warning::repo variable CLERK_PUBLISHABLE_KEY not set; sign-in disabled"; fi
          npx wrangler deploy --var "DEVICE_AUD:$DEVICE_AUD" --var "OPS_AUD:$OPS_AUD" --var "CLERK_PUBLISHABLE_KEY:$CLERK_PUBLISHABLE_KEY"
      - name: Clerk secret key
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then echo "::warning::secret CLERK_SECRET_KEY not set"; exit 0; fi
          printf '%s' "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY
      - name: Enrollment credential (Access service tokens edit only)
        env:
          HUB_ENROLL_CF_TOKEN: ${{ secrets.HUB_ENROLL_CF_TOKEN }}
        run: |
          if [ -z "$HUB_ENROLL_CF_TOKEN" ]; then echo "::warning::HUB_ENROLL_CF_TOKEN not set; /ops/enroll disabled"; exit 0; fi
          printf '%s' "$HUB_ENROLL_CF_TOKEN" | npx wrangler secret put CF_ENROLL_TOKEN
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            body=$(curl -s -A esp-launcher-ci https://$HUB_HOST/api/config || true)
            echo "$body" | grep -q "\"hub\":\"$HUB_HOST\"" && echo "hub is up: $body" && exit 0
            sleep 6
          done
          echo "hub did not answer"; exit 1

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      HUB: hub.c3p0.dev
      SIM_CLIENT_ID: ${{ secrets.SIM_CLIENT_ID }}
      SIM_CLIENT_SECRET: ${{ secrets.SIM_CLIENT_SECRET }}
      OPS_CLIENT_ID: ${{ secrets.OPS_CLIENT_ID }}
      OPS_CLIENT_SECRET: ${{ secrets.OPS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Production end-to-end through Cloudflare Access
        run: |
          if [ -z "$SIM_CLIENT_SECRET" ] || [ -z "$OPS_CLIENT_SECRET" ]; then
            echo "::warning::SIM_/OPS_ client secrets not set; skipping production e2e"; exit 0
          fi
          pip install -q 'websockets>=14'
          sleep 20   # let Access policy changes propagate
          python3 hub/test/prod_e2e.py
